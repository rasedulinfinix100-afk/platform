name: Install ticket chart assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-ticket-assets.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract ticket package
        run: |
          set -euo pipefail
          mkdir -p public/images/tickets
          unzip -o public/images/tickets/ticket-chart-update-package.zip -d /tmp/ticket-chart-package
          cp /tmp/ticket-chart-package/ticket-*.webp public/images/tickets/
          cp /tmp/ticket-chart-package/page.tsx app/Ticket/Chart/page.tsx
          cp /tmp/ticket-chart-package/chart.css app/Ticket/chart.css
      - name: Commit extracted assets and chart page
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/tickets/ticket-*.webp app/Ticket/Chart/page.tsx app/Ticket/chart.css
          if git diff --cached --quiet; then
            echo "No ticket chart changes to commit."
            exit 0
          fi
          git commit -m "Install seven ticket chart banners"
          git push